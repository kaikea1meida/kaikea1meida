    <tspan x="175" y="67">  ███║ ███╗███║ ███╔═███╗ ███╔╝███╔╝ ███╔═███╗███╔═══╝███╔═███╗███╔═══╝</tspan>
    <tspan x="175" y="80">  ███║  ██████║ ███║ ╚══╝ ███║ ███║  ███║ ╚══╝ █████  ███████╔╝ █████╗ </tspan>
    <tspan x="175" y="93">  ███║   █████║ ███║ ███╗ ███║ ███║  ███║      ╚══███╗███╔═══╝  ╚══███╗</tspan>
