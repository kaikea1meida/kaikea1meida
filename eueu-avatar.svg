<svg xmlns="http://www.w3.org/2000/svg" width="750" height="380" viewBox="0 0 750 380">
  <style>
    .ascii-art {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 5px;
      line-height: 5.3px;
      fill: #c9d1d9;
      white-space: pre;
    }
    .neofetch-title {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #e06c75;
    }
    .neofetch-key {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      fill: #98c379;
    }
    .neofetch-val {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 11px;
      fill: #c9d1d9;
    }
    .neofetch-sep {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 11px;
      fill: #5c6370;
    }
    @media (prefers-color-scheme: light) {
      .ascii-art, .neofetch-val { fill: #24292f; }
      .neofetch-sep { fill: #6a737d; }
    }
  </style>

